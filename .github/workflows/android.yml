name: build-android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # flutter create 会生成一个引用 MyApp 的模板测试，与本项目不符，建完就删
      - name: Generate android shell
        run: |
          flutter create . --platforms=android
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Static check
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Unit tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: one-reader-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # 失败时把日志提交回仓库，方便手机端直接读取定位（public 仓库可用 raw 链接查看）
      - name: Collect failure logs
        if: failure()
        run: |
          mkdir -p ci
          for f in analyze.log test.log build.log; do
            if [ -f "$f" ]; then cp "$f" "ci/$f"; fi
          done
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add ci || true
          git commit -m "ci: 记录失败日志 [skip ci]" || true
          git push || true
