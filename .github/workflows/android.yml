name: build-android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      # flutter create 会生成一个引用 MyApp 的模板测试，与本项目不符，建完就删
      - name: Generate android shell
        run: |
          flutter create . --platforms=android
          rm -f test/widget_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Static check
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log

      - name: Unit tests
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: one-reader-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # 失败时把日志里的错误转成 annotation（公开仓库的 Checks 页面无需登录即可看到），
      # 方便在手机上直接定位，不依赖登录下载日志。
      - name: Report errors as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import re, os

          def report(path, tag):
              if not os.path.exists(path):
                  return
              text = open(path, encoding='utf-8', errors='replace').read().splitlines()
              errs = [l for l in text if re.search(r'\berror\b', l, re.I) and len(l.strip()) > 5]
              for line in (errs[:6] or text[-6:]):
                  m = re.search(r'([\w./-]+\.dart):(\d+):(\d+)', line)
                  msg = line.strip().replace('\n', ' ')[:400]
                  if m:
                      print(f"::error file={m.group(1)},line={m.group(2)},col={m.group(3)}::{tag}: {msg}")
                  else:
                      print(f"::error::{tag}: {msg}")

          report('analyze.log', 'analyze')
          report('test.log', 'test')
          report('build.log', 'build')
          PY
